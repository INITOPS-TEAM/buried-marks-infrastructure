services:

  nginx:
    image: nginx:1.28.2
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - map-service
      - mail-service
      - voting-service
      - login-front
      - map-front
      - admin-front
      - voting-front
    restart: always

  login-front:
    container_name: login-frontend-service
    build:
      context: ../buried-marks-frontend-microservice/services/login_front
      dockerfile: Dockerfile
    env_file:
      - .env.front
    expose:
      - "8080"
    restart: always

  map-front:
    container_name: map-frontend-service
    build:
      context: ../buried-marks-frontend-microservice/services/map_front
      dockerfile: Dockerfile
    env_file:
      - .env.map.front
    expose:
      - "8080"
    restart: always

  voting-front:
    container_name: voting-frontend-service
    build:
      context: ../buried-marks-frontend-microservice/services/voting_front
      dockerfile: Dockerfile
    env_file:
      - .env.front
    expose:
      - "8080"
    restart: always

  admin-front:
    container_name: admin-frontend-service
    build:
      context: ../buried-marks-frontend-microservice/services/admin_front
      dockerfile: Dockerfile
    env_file:
      - .env.front
    expose:
      - "8080"
    restart: always

  auth-db:
    image: postgres:18-alpine
    env_file:
      - ../buried-marks-authentication-microservice/.env
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  auth-service:
    build:
      context: ../buried-marks-authentication-microservice
      dockerfile: Dockerfile
    env_file:
      - ../buried-marks-authentication-microservice/.env
    environment:
      DB_HOST: auth-db
    expose:
      - "8000"
    depends_on:
      -   auth-db
    volumes:
      - type: bind
        source: ../secrets/jwt_public_key
        target: /tmp/jwt_public_key
      - type: bind
        source: ../secrets/jwt_private_key
        target: /tmp/jwt_private_key
    entrypoint: ./entrypoint.sh
    restart: always

  map-service-db:
    env_file:
      - ../buried-marks-map-microservice/.env
    image: mariadb:11.4-noble
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  map-service:
    image: 531331080468.dkr.ecr.eu-north-1.amazonaws.com/buried-marks-map-microservice
    env_file:
      - ../buried-marks-map-microservice/.env
    expose:
      - "9001"
    environment:
      DATABASE_HOST: map-service-db
    depends_on:
      map-service-db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ../secrets/jwt_public_key
        target: /tmp/jwt_public_key
    entrypoint: ./entrypoint.sh
    restart: always

  valkey-db:
    image: valkey/valkey:9-alpine
    volumes:
      - valkey_data:/data
    restart: always

  mail-service:
    build:
      context: ../buried-marks-mail-microservice
      dockerfile: Dockerfile
    env_file:
      - ../buried-marks-mail-microservice/.env
    depends_on:
      - valkey-db
    restart: always

  voting-service:
    build:
      context: ../buried-marks-voting-microservice
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ../secrets/jwt_public_key
        target: /tmp/jwt_public_key
    env_file:
      - ../buried-marks-voting-microservice/.env
    expose:
      - "8900"
    depends_on:
      - voting-db
    entrypoint: ./entrypoint.sh
    restart: always

  voting-db:
    image: postgres:alpine
    env_file:
      - ../buried-marks-voting-microservice/.env
    expose:
      - "5432"
    volumes:
      - voting_db_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
  valkey_data:
  voting_db_data:
  mariadb_data:
